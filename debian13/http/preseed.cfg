# ============================================
# Preseed для Debian 13 на Proxmox VE (EFI + XFS + LVM)
# ============================================

### Локализация
d-i debian-installer/language string en
d-i debian-installer/country string RU
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i localechooser/translation/warn-severe boolean true

### Сеть (настраиваем рано, таймаут короткий для офлайн)
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 5
d-i netcfg/get_hostname string debian-13-template
d-i netcfg/get_domain string local

### ============================================
### ЗЕРКАЛА
### ============================================
# Основное зеркало — Яндекс
d-i mirror/country string manual
d-i mirror/http/hostname string mirror.yandex.ru
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# ПОЛНОСТЬЮ ОТКЛЮЧАЕМ DVD/CD-ROM
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Используем только сетевое зеркало
d-i apt-setup/use_mirror boolean true
d-i apt-setup/no_mirror boolean false

# Отключаем всё лишнее
d-i apt-setup/services-select multiselect
d-i apt-setup/enable-source-repositories boolean false
d-i apt-setup/components multiselect main contrib non-free non-free-firmware

### Пользователи
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$y/lW7TuJRHkCn54H$hOCIptiU1dFLpbqdGjK8IntTWbr4hic9jY5x2rPna7lcyWxXgx4EWlaTQPxiNp/yHbKHNyeDXMWjW70bTVoEQ/

# Создаём пользователя ansible
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Ansible
d-i passwd/username string ansible
d-i passwd/user-password-crypted password $6$y/lW7TuJRHkCn54H$hOCIptiU1dFLpbqdGjK8IntTWbr4hic9jY5x2rPna7lcyWxXgx4EWlaTQPxiNp/yHbKHNyeDXMWjW70bTVoEQ/
d-i passwd/user-default-groups string sudo

### Часовой пояс
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Moscow
d-i clock-setup/ntp boolean false

### ============================================
### Разметка диска (LVM с XFS)
### ============================================
d-i anna/choose_modules string partman-xfs,partman-lvm,partman-efi
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string 24GB
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/new_vg_name string sys

d-i partman-auto/expert_recipe string \
    boot-root :: \
        1024 500 1100 fat32 \
            $primary{ } $bootable{ } $efi{ } \
            method{ efi } format{ } \
            mountpoint{ /boot/efi } \
        . \
        1024 501 1100 ext4 \
            $primary{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        5325 505 5325 xfs \
            $lvmok{ } \
            lv_name{ var } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ xfs } \
            mountpoint{ /var } \
        . \
        5325 505 5325 xfs \
            $lvmok{ } \
            lv_name{ home } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ xfs } \
            mountpoint{ /home } \
        . \
        2048 505 2100 linux-swap \
            $lvmok{ } \
            lv_name{ swap } \
            method{ swap } format{ } \
        . \
        10240 502 10500 xfs \
            $lvmok{ } \
            lv_name{ root } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ xfs } \
            mountpoint{ / } \
        . 

d-i partman-auto/choose_recipe select boot-root
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Загрузчик
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
# d-i grub-installer/efi boolean true

### Выбор ПО
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string openssh-server qemu-guest-agent tree wget curl sudo net-tools traceroute telnet vim cloud-init parted

# ВАЖНО: допустимы только none, safe-upgrade, full-upgrade
d-i pkgsel/upgrade select full-upgrade
# ВАЖНО: допустимы none или unattended-upgrades
d-i pkgsel/update-policy select none

### Финальная настройка (sudo, SSH, guest-agent)
d-i preseed/late_command string \
    echo 'ansible ALL=(root) NOPASSWD: ALL' > /target/etc/sudoers.d/ansible; \
    chmod 0440 /target/etc/sudoers.d/ansible; \
    chown root:root /target/etc/sudoers.d/ansible; \
    in-target usermod -aG sudo ansible; \
    in-target systemctl enable ssh; \
    in-target systemctl enable qemu-guest-agent

### Завершение
d-i finish-install/reboot_in_progress note